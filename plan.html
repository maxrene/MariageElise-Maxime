<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Table Interactif</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }

        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Smooth drop transitions */
        .seat-droppable { transition: all 0.2s ease; }
        .seat-droppable.drag-over { background-color: #dcfce7; border-color: #22c55e; transform: scale(1.1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

        /* Print styles to hide UI and only show the floorplan */
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-canvas { width: 100% !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; }
            .table-container { page-break-inside: avoid; }
            /* Force exact background colors for print */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }

        /* Password Modal Styling (Similar to index.html) */
        #password-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f8f0e3; /* Light beige matching site theme */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: Arial, sans-serif;
        }
        .password-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .password-container h2 {
            color: #4a4137;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .password-input-wrapper {
            margin-bottom: 15px;
        }
        .password-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .password-container button {
            background-color: #c8a07d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .password-container button:hover {
            background-color: #b58d6b;
        }
        #password-error {
            color: #d32f2f;
            display: none;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #app-wrapper {
            display: none; /* Hidden by default until password is correct */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-slate-800 m-0">

    <!-- Password Protection Modal -->
    <div id="password-modal">
        <div class="password-container">
            <h2>Plan de table</h2>
            <p style="margin-bottom: 20px; color: #666; font-size: 14px;">Entrez le mot de passe pour accéder à cette page secrète.</p>
            <div class="password-input-wrapper">
                <input type="password" id="password-input" placeholder="Mot de passe">
            </div>
            <div id="password-error">Mot de passe incorrect.</div>
            <button onclick="checkPassword()">Accéder</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-wrapper">
        <div id="root" class="h-full w-full"></div>
    </div>

    <!-- Password Logic -->
    <script>
        const correctPassword = "Table";

        function checkPassword() {
            const input = document.getElementById("password-input").value;
            if (input === correctPassword) {
                document.getElementById("password-modal").style.display = "none";
                document.getElementById("app-wrapper").style.display = "block";
            } else {
                document.getElementById("password-error").style.display = "block";
            }
        }

        // Allow pressing Enter to submit
        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- CONFIGURATION DE SAUVEGARDE ---
        // Votre vraie URL de l'application web de votre Google Apps Script
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXFF4qfByrw0pPzOUk-LDOXXNLu0sL0uJ6sB7LBnd7uy7QVMs95qQLf0qB_vJrdIjsMw/exec";

        // Utility Icons
        const Icons = {
            User: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Users: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Plus: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Printer: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            Trash: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Wand: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.4 2.4 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z"/><path d="m5 12 7-7"/><path d="M8 9h.01"/><path d="M12 5h.01"/><path d="M16 9h.01"/></svg>,
            Pencil: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Save: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        };

        // Initial Data Generation
        const generateInitialGuests = () => {
            const names = [
                "Maxime (Marié)", "Elise (Mariée)",
                "Hugo René", "Julie Soenen", "Maman Flo Smutko", "Philippe Sabot", "Océane Edely",
                "Fiona Coco", "Matthieu Nachez", "Martin Moncarré", "Elise Faverger", "Dimitri Macé",
                "Ludo Perrin", "Virginie Perrin", "Léna Perrin", "Éloïse Perrin", "Dorian Pereira",
                "Nadia Djoukitch-Pinêtre", "Sébastien Djoukitch", "Radjma Mlanao", "Nicolas Godinaud",
                "Marie-Sophie Cuinet", "Quentin Chaleard", "Alix Massé", "Marc Thuillier", "Aïssata Diop",
                "Antton Bodin", "Théo Penchet", "Manon Roussel", "Maxime Charousset", "Isabelle Lechevallier",
                "Cedric Lechevallier", "Christophe Guichon", "Carole Blin", "Laure Badet", "Gazeres Marc",
                "Emmanuelle Gazeres Djoukitch", "Caroline Arles", "Clément Virenque", "Florent Ponnoussamy",
                "Luc Vigier", "Emma Ogden", "Julie Smutko", "Maxime Bechade", "Juliette Chaucho",
                "Robin Bjalon", "Aude Guillon", "Lucie Davail", "Johan Vincenzotto", "Clemence Jolly",
                "Camille Toussaint", "Nicolas Arlès", "Amélie Arlès", "Thomas Gounot", "Clara Robert Muhlke",
                "Arthur Guillemot", "Chloé Guillemot", "Emilie Koch", "Bastien Usquelis", "Lauranne Jousse",
                "Thibault Quiquet", "Mustaf Ahmed", "Clélie Cornu", "Louis Badet", "Maxence Riou",
                "Claude Smutko", "Martine Smutko Djoukitch", "Thomas Cuinet", "Alice Cuinet", "Christiane Arles",
                "Jacques Arles", "Arthur Lauriau", "Eleonore Lauriau", "Marion René", "Josh Woodcock",
                "Gaël Mosenego", "Nolwenn Loison", "Alexandre Cheraki", "Alexis Perrin", "Lise Macé",
                "Nicole Descotte", "Gerard Descotte", "Noemie Pérès", "Benjamin De la Gueldre",
                "Marion De La Gueldre", "Valentin Jolly", "Claudine Djoukitch", "Giulia Di marco",
                "Patrick René", "Baptiste Massy", "Alexandre Ayache"
            ];
            return names.map((name, index) => ({
                id: `g-${index + 1}`,
                name: name,
                tableId: null,
                seatIndex: null
            }));
        };

        const initialTables = [
            { id: 't-head', type: 'rect', name: 'Table d\'Honneur', capacity: 18, x: 550, y: 150 },
            { id: 't-round-1', type: 'round', name: 'Table 1', capacity: 10, x: 200, y: 550 },
            { id: 't-round-2', type: 'round', name: 'Table 2', capacity: 10, x: 700, y: 550 },
            { id: 't-round-3', type: 'round', name: 'Table 3', capacity: 10, x: 1200, y: 550 },
            { id: 't-round-4', type: 'round', name: 'Table 4', capacity: 10, x: 200, y: 1050 },
            { id: 't-round-5', type: 'round', name: 'Table 5', capacity: 10, x: 700, y: 1050 },
            { id: 't-round-6', type: 'round', name: 'Table 6', capacity: 10, x: 1200, y: 1050 },
            { id: 't-round-7', type: 'round', name: 'Table 7', capacity: 10, x: 450, y: 1550 },
            { id: 't-round-8', type: 'round', name: 'Table 8', capacity: 10, x: 950, y: 1550 },
        ];

        function App() {
            const [isInitializing, setIsInitializing] = useState(true);
            const [dataLoaded, setDataLoaded] = useState(false);
            const [guests, setGuests] = useState([]);
            const [tables, setTables] = useState([]);
            const [saveStatus, setSaveStatus] = useState("ready"); // ready, saving, success, error

            const [newGuestName, setNewGuestName] = useState("");
            const [editingGuest, setEditingGuest] = useState(null);

            // État pour gérer le déplacement des tables
            const [draggingTable, setDraggingTable] = useState(null);

            // 1. Chargement des données au démarrage
            useEffect(() => {
                const loadData = async () => {
                    try {
                        if (APPS_SCRIPT_URL === "URL_APPS_SCRIPT_ICI") {
                            console.log("URL Apps Script non configurée, chargement des données par défaut.");
                            setGuests(generateInitialGuests());
                            setTables(initialTables);
                            setDataLoaded(true);
                            setIsInitializing(false);
                            return;
                        }

                        const response = await fetch(APPS_SCRIPT_URL);
                        const data = await response.json();

                        if (data && data.guests && data.tables) {
                            setGuests(data.guests);
                            setTables(data.tables);
                        } else {
                            // Données initiales si le sheet est vide
                            setGuests(generateInitialGuests());
                            setTables(initialTables);
                        }
                    } catch (error) {
                        console.error("Erreur lors du chargement des données:", error);
                        // Fallback sur les données par défaut en cas d'erreur
                        setGuests(generateInitialGuests());
                        setTables(initialTables);
                    } finally {
                        setDataLoaded(true);
                        setIsInitializing(false);
                    }
                };

                loadData();
            }, []);

            // 2. Sauvegarde automatique (Debounced pour la performance)
            const isFirstLoad = React.useRef(true);
            useEffect(() => {
                if (!dataLoaded) return;

                if (isFirstLoad.current) {
                    isFirstLoad.current = false;
                    return;
                }

                // Délais de 1.5s pour regrouper les écritures
                const timer = setTimeout(() => {
                    saveData();
                }, 1500);

                return () => clearTimeout(timer);
            }, [guests, tables, dataLoaded]);

            const saveData = async () => {
                if (APPS_SCRIPT_URL === "URL_APPS_SCRIPT_ICI") return;

                setSaveStatus("saving");
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ guests, tables }),
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8', // Contourne le preflight CORS
                        }
                    });

                    const result = await response.json();
                    if (result.status === "success") {
                        setSaveStatus("success");
                        setTimeout(() => setSaveStatus("ready"), 2000);
                    } else {
                        throw new Error(result.message);
                    }
                } catch (error) {
                    console.error("Erreur de sauvegarde:", error);
                    setSaveStatus("error");
                }
            };

            // Derived state
            const unassignedGuests = useMemo(() => guests.filter(g => g.tableId === null), [guests]);

            const seatedCount = guests.length - unassignedGuests.length;
            const totalCapacity = tables.reduce((sum, table) => sum + table.capacity, 0);

            const handleDragStart = (e, guestId) => {
                e.dataTransfer.setData('guestId', guestId);
                // Slight delay to allow drag image to capture before we optionally style the source
                setTimeout(() => {
                    e.target.classList.add('opacity-50');
                }, 0);
            };

            const handleDragEnd = (e) => {
                e.target.classList.remove('opacity-50');
            };

            const handleDropOnSeat = (guestId, targetTableId, targetSeatIndex) => {
                setGuests(prev => {
                    const newGuests = [...prev];
                    const draggedIndex = newGuests.findIndex(g => g.id === guestId);
                    if (draggedIndex === -1) return prev;

                    const draggedGuest = newGuests[draggedIndex];
                    const existingGuestIndex = newGuests.findIndex(g => g.tableId === targetTableId && g.seatIndex === targetSeatIndex);

                    // If target seat is occupied, perform a swap
                    if (existingGuestIndex !== -1) {
                        const existingGuest = newGuests[existingGuestIndex];
                        newGuests[existingGuestIndex] = {
                            ...existingGuest,
                            tableId: draggedGuest.tableId,
                            seatIndex: draggedGuest.seatIndex
                        };
                    }

                    // Move dragged guest to new seat
                    newGuests[draggedIndex] = {
                        ...draggedGuest,
                        tableId: targetTableId,
                        seatIndex: targetSeatIndex
                    };

                    return newGuests;
                });
            };

            const handleDropUnassigned = (e) => {
                e.preventDefault();
                const guestId = e.dataTransfer.getData('guestId');
                if (!guestId) return;

                setGuests(prev => prev.map(g =>
                    g.id === guestId ? { ...g, tableId: null, seatIndex: null } : g
                ));
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            // Gestionnaires pour déplacer les tables
            const handleTableMouseDown = (e, tableId) => {
                if (e.button !== 0) return; // Uniquement le clic gauche
                const table = tables.find(t => t.id === tableId);
                setDraggingTable({
                    id: tableId,
                    startX: e.pageX,
                    startY: e.pageY,
                    origX: table.x,
                    origY: table.y
                });
            };

            const handleCanvasMouseMove = (e) => {
                if (!draggingTable) return;
                const dx = e.pageX - draggingTable.startX;
                const dy = e.pageY - draggingTable.startY;

                // Empêche la table de sortir par le haut/gauche (limite de la zone)
                const newX = Math.max(50, draggingTable.origX + dx);
                const newY = Math.max(50, draggingTable.origY + dy);

                setTables(prev => prev.map(t =>
                    t.id === draggingTable.id
                        ? { ...t, x: newX, y: newY }
                        : t
                ));
            };

            const handleCanvasMouseUp = () => {
                setDraggingTable(null);
            };

            const handleEditGuestSubmit = (e) => {
                e.preventDefault();
                if (!editingGuest || !editingGuest.name.trim()) return;
                setGuests(prev => prev.map(g => g.id === editingGuest.id ? editingGuest : g));
                setEditingGuest(null);
            };

            const addGuest = (e) => {
                e.preventDefault();
                if (!newGuestName.trim()) return;
                const newGuest = {
                    id: `g-${Date.now()}`,
                    name: newGuestName.trim(),
                    tableId: null,
                    seatIndex: null
                };
                setGuests([...guests, newGuest]);
                setNewGuestName("");
            };

            const removeGuest = (guestId) => {
                if (confirm("Voulez-vous vraiment supprimer cet invité ?")) {
                    setGuests(prev => prev.filter(g => g.id !== guestId));
                }
            };

            const addRoundTable = () => {
                const nextNum = tables.filter(t => t.type === 'round').length + 1;
                const newTable = {
                    id: `t-round-${Date.now()}`,
                    type: 'round',
                    name: `Table ${nextNum}`,
                    capacity: 10,
                    x: 300, // Position par défaut visible
                    y: 300
                };
                setTables([...tables, newTable]);
            };

            const autoSeat = () => {
                let currentUnassigned = [...unassignedGuests];
                if (currentUnassigned.length === 0) return;

                let nextGuests = [...guests];

                tables.forEach(table => {
                    for (let i = 0; i < table.capacity; i++) {
                        // Check if seat empty
                        const isOccupied = nextGuests.some(g => g.tableId === table.id && g.seatIndex === i);
                        if (!isOccupied && currentUnassigned.length > 0) {
                            const guestToSeat = currentUnassigned.shift();
                            // Update guest in main array
                            const gIndex = nextGuests.findIndex(g => g.id === guestToSeat.id);
                            nextGuests[gIndex] = { ...guestToSeat, tableId: table.id, seatIndex: i };
                        }
                    }
                });
                setGuests(nextGuests);
            };

            const clearAllSeats = () => {
                if(confirm("Êtes-vous sûr de vouloir vider toutes les tables ?")) {
                    setGuests(guests.map(g => ({ ...g, tableId: null, seatIndex: null })));
                }
            };

            if (isInitializing || !dataLoaded) {
                return (
                    <div className="h-full w-full flex items-center justify-center bg-slate-50">
                        <div className="flex flex-col items-center gap-4">
                            <div className="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                            <p className="text-slate-500 font-medium">Chargement de votre plan de table...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-full w-full bg-slate-50 relative">

                    {/* Sidebar / Guest List */}
                    <div className="w-80 bg-white border-r border-slate-200 shadow-xl flex flex-col z-10 no-print transition-all duration-300">
                        <div className="p-5 border-b border-slate-100 bg-slate-50">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h1 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                        <Icons.Users /> Liste des invités
                                    </h1>
                                    <p className="text-sm text-slate-500 mt-1">
                                        {seatedCount} sur {guests.length} Placés
                                    </p>
                                </div>
                            </div>

                            {/* Capacity Warning */}
                            {guests.length > totalCapacity && (
                                <div className="mt-3 text-xs p-2 bg-red-50 text-red-600 rounded-md border border-red-100">
                                    Attention : Pas assez de places ! Capacité : {totalCapacity}.
                                </div>
                            )}

                            {/* Add Guest Form */}
                            <form onSubmit={addGuest} className="mt-4 flex gap-2">
                                <input
                                    type="text"
                                    value={newGuestName}
                                    onChange={(e) => setNewGuestName(e.target.value)}
                                    placeholder="Nouveau nom..."
                                    className="flex-1 px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                                <button type="submit" className="p-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition" title="Add Guest">
                                    <Icons.Plus />
                                </button>
                            </form>
                        </div>

                        {/* Unassigned Guests Dropzone */}
                        <div
                            className="flex-1 overflow-y-auto p-4"
                            onDrop={handleDropUnassigned}
                            onDragOver={handleDragOver}
                        >
                            <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-1">
                                Non assignés ({unassignedGuests.length})
                            </h2>

                            {unassignedGuests.length === 0 ? (
                                <div className="text-center p-6 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-sm">
                                    Tous les invités sont placés !
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {unassignedGuests.map(guest => (
                                        <div
                                            key={guest.id}
                                            draggable
                                            onDragStart={(e) => handleDragStart(e, guest.id)}
                                            onDragEnd={handleDragEnd}
                                            className="bg-white border border-slate-200 p-3 rounded-lg shadow-sm cursor-grab active:cursor-grabbing hover:border-blue-300 hover:shadow-md transition-all flex items-center gap-3 group"
                                        >
                                            <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xs">
                                                {guest.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()}
                                            </div>
                                            <span className="font-medium text-slate-700 text-sm truncate max-w-[150px]">{guest.name}</span>
                                            <div className="ml-auto opacity-0 group-hover:opacity-100 flex items-center gap-1">
                                                <button
                                                    onClick={() => setEditingGuest(guest)}
                                                    className="p-1 text-slate-400 hover:text-blue-600 transition"
                                                    title="Modifier le nom"
                                                >
                                                    <Icons.Pencil />
                                                </button>
                                                <button
                                                    onClick={() => removeGuest(guest.id)}
                                                    className="p-1 text-slate-400 hover:text-red-600 transition"
                                                    title="Supprimer"
                                                >
                                                    <Icons.Trash />
                                                </button>
                                                <div className="text-slate-300 cursor-grab ml-1" title="Déplacer">
                                                    <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Sidebar Footer Controls */}
                        <div className="p-4 border-t border-slate-100 bg-slate-50 space-y-2">
                            <button
                                onClick={autoSeat}
                                disabled={unassignedGuests.length === 0 || (guests.length > totalCapacity && totalCapacity === seatedCount)}
                                className="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white rounded-lg text-sm font-medium transition-colors shadow-sm"
                            >
                                <Icons.Wand /> Placement Automatique
                            </button>
                            <button
                                onClick={clearAllSeats}
                                className="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-slate-300 hover:bg-red-50 hover:text-red-600 hover:border-red-200 text-slate-700 rounded-lg text-sm font-medium transition-colors shadow-sm"
                            >
                                <Icons.Trash /> Vider les tables
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto print-canvas relative bg-slate-50">
                        {/* Top Action Bar (hidden on print) */}
                        <div className="sticky top-0 left-0 right-0 p-4 flex justify-between items-center no-print z-20 pointer-events-none">
                            {/* Save Status Indicator */}
                            <div className="bg-white px-3 py-1.5 rounded-full shadow-md border border-slate-200 flex items-center gap-2 pointer-events-auto">
                                {saveStatus === "ready" && <span className="text-xs text-slate-500 flex items-center gap-1"><Icons.Save /> Sauvegardé</span>}
                                {saveStatus === "saving" && <span className="text-xs text-blue-500 flex items-center gap-1"><div className="w-3 h-3 border-2 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div> Sauvegarde...</span>}
                                {saveStatus === "success" && <span className="text-xs text-green-600 flex items-center gap-1"><svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Sauvegardé</span>}
                                {saveStatus === "error" && <span className="text-xs text-red-500 flex items-center gap-1"><Icons.Trash /> Erreur de sauvegarde</span>}
                                {APPS_SCRIPT_URL === "URL_APPS_SCRIPT_ICI" && <span className="text-xs text-amber-600">⚠️ Mode local (non sauvegardé)</span>}
                            </div>

                            <div className="flex gap-3 pointer-events-auto">
                                <button
                                    onClick={addRoundTable}
                                    className="flex items-center gap-2 px-4 py-2 bg-white shadow-md border border-slate-200 rounded-full text-sm font-medium text-slate-700 hover:text-blue-600 hover:border-blue-200 transition"
                                >
                                    <Icons.Plus /> Ajouter Table de 10
                                </button>
                                <button
                                    onClick={() => window.print()}
                                    className="flex items-center gap-2 px-4 py-2 bg-slate-800 shadow-md text-white rounded-full text-sm font-medium hover:bg-slate-700 transition"
                                >
                                    <Icons.Printer /> Imprimer le Plan
                                </button>
                            </div>
                        </div>

                        {/* Draggable Floorplan Canvas */}
                        <div
                            className="absolute top-0 left-0 min-w-[2500px] min-h-[2500px] bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:30px_30px] overflow-hidden table-container"
                            onMouseMove={handleCanvasMouseMove}
                            onMouseUp={handleCanvasMouseUp}
                            onMouseLeave={handleCanvasMouseUp}
                        >
                            <HeadTable
                                table={tables.find(t => t.type === 'rect')}
                                guests={guests}
                                onDropGuest={handleDropOnSeat}
                                onDragStart={handleDragStart}
                                onDragEnd={handleDragEnd}
                                onMouseDown={handleTableMouseDown}
                                isDragging={draggingTable?.id === tables.find(t => t.type === 'rect')?.id}
                                onEditGuest={setEditingGuest}
                            />

                            {tables.filter(t => t.type === 'round').map(table => (
                                <RoundTable
                                    key={table.id}
                                    table={table}
                                    guests={guests}
                                    onDropGuest={handleDropOnSeat}
                                    onDragStart={handleDragStart}
                                    onDragEnd={handleDragEnd}
                                    onMouseDown={handleTableMouseDown}
                                    isDragging={draggingTable?.id === table.id}
                                    onEditGuest={setEditingGuest}
                                />
                            ))}
                        </div>
                    </div>

                    {/* Edit Guest Modal */}
                    {editingGuest && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md animate-[fadeIn_0.2s_ease-out]">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <Icons.Pencil /> Modifier l'invité
                                </h3>
                                <form onSubmit={handleEditGuestSubmit}>
                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Nom affiché</label>
                                        <input
                                            type="text"
                                            value={editingGuest.name}
                                            onChange={(e) => setEditingGuest({...editingGuest, name: e.target.value})}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            autoFocus
                                        />
                                        <p className="text-xs text-slate-500 mt-2">
                                            Astuce: Modifiez le nom pour ajuster les initiales (ex: "Gérard D." affichera "GD").
                                        </p>
                                    </div>
                                    <div className="flex justify-between">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                removeGuest(editingGuest.id);
                                                setEditingGuest(null);
                                            }}
                                            className="px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg font-medium transition flex items-center gap-1"
                                        >
                                            <Icons.Trash /> Supprimer
                                        </button>
                                        <div className="flex gap-3">
                                            <button
                                                type="button"
                                                onClick={() => setEditingGuest(null)}
                                                className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition"
                                            >
                                                Annuler
                                            </button>
                                            <button
                                                type="submit"
                                                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-sm transition"
                                            >
                                                Enregistrer
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function HeadTable({ table, guests, onDropGuest, onDragStart, onDragEnd, onMouseDown, isDragging, onEditGuest }) {
            if (!table) return null;

            // Split capacity evenly for top and bottom rows
            const halfCapacity = Math.ceil(table.capacity / 2);

            const renderSeats = (startIndex, endIndex) => (
                <div className="flex justify-center gap-4 px-8 z-10">
                    {Array.from({ length: endIndex - startIndex }).map((_, idx) => {
                        const i = startIndex + idx;
                        const guest = guests.find(g => g.tableId === table.id && g.seatIndex === i);
                        return (
                            <Seat
                                key={i}
                                tableId={table.id}
                                seatIndex={i}
                                guest={guest}
                                onDropGuest={onDropGuest}
                                onDragStart={onDragStart}
                                onDragEnd={onDragEnd}
                                onEditGuest={onEditGuest}
                            />
                        );
                    })}
                </div>
            );

            return (
                <div
                    style={{ position: 'absolute', left: table.x, top: table.y }}
                    className={`flex flex-col items-center transition-shadow ${isDragging ? 'z-50 cursor-grabbing drop-shadow-2xl' : 'z-10 cursor-grab drop-shadow-md'} hover:drop-shadow-xl`}
                    onMouseDown={(e) => onMouseDown(e, table.id)}
                >
                    {/* Top Seats Row */}
                    <div className="mb-3">
                        {renderSeats(0, halfCapacity)}
                    </div>

                    {/* Physical Table */}
                    <div className="w-[900px] max-w-[90vw] h-24 bg-gradient-to-b from-slate-200 to-slate-300 border-2 border-slate-300 rounded-md shadow-lg flex items-center justify-center relative">
                        <span className="font-semibold text-slate-500 uppercase tracking-widest text-lg">{table.name}</span>
                        {/* Table Decoration / Inner Line */}
                        <div className="absolute inset-2 border border-slate-300/50 rounded pointer-events-none"></div>
                    </div>

                    {/* Bottom Seats Row */}
                    <div className="mt-3">
                        {renderSeats(halfCapacity, table.capacity)}
                    </div>
                </div>
            );
        }

        function RoundTable({ table, guests, onDropGuest, onDragStart, onDragEnd, onMouseDown, isDragging, onEditGuest }) {
            const tableDiameter = 180; // px
            // The radius to the center of the seat should push it outside the table
            const seatRadius = (tableDiameter / 2) + 35; // 90 + 35 = 125px

            const seats = Array.from({ length: table.capacity }).map((_, i) => {
                const guest = guests.find(g => g.tableId === table.id && g.seatIndex === i);
                const angleDegree = (i * (360 / table.capacity));

                // Using transform translation and counter-rotation keeps seats upright perfectly!
                const seatStyle = {
                    position: 'absolute',
                    top: '50%',
                    left: '50%',
                    // Center the seat perfectly at the origin before translating
                    marginTop: '-24px', // half of h-12 (48px)
                    marginLeft: '-24px', // half of w-12
                    transform: `rotate(${angleDegree}deg) translateY(-${seatRadius}px) rotate(-${angleDegree}deg)`
                };

                return (
                    <div key={i} style={seatStyle} className="z-10">
                        <Seat
                            tableId={table.id}
                            seatIndex={i}
                            guest={guest}
                            onDropGuest={onDropGuest}
                            onDragStart={onDragStart}
                            onDragEnd={onDragEnd}
                            onEditGuest={onEditGuest}
                        />
                    </div>
                );
            });

            return (
                <div
                    style={{ position: 'absolute', left: table.x, top: table.y, width: tableDiameter, height: tableDiameter }}
                    className={`transition-shadow ${isDragging ? 'z-50 cursor-grabbing drop-shadow-2xl' : 'z-10 cursor-grab drop-shadow-md'} hover:drop-shadow-xl`}
                    onMouseDown={(e) => onMouseDown(e, table.id)}
                >
                    {/* The Physical Round Table */}
                    <div className="w-full h-full bg-gradient-to-br from-slate-200 to-slate-300 border-2 border-slate-300 rounded-full shadow-lg flex items-center justify-center absolute inset-0">
                        <div className="text-center">
                            <span className="font-bold text-slate-600 block">{table.name}</span>
                            <span className="text-xs text-slate-400 font-medium">10 Places</span>
                        </div>
                        {/* Table Centerpiece Decoration */}
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 border border-slate-300/60 rounded-full pointer-events-none"></div>
                    </div>
                    {/* Seats container */}
                    {seats}
                </div>
            );
        }

        function Seat({ tableId, seatIndex, guest, onDropGuest, onDragStart, onDragEnd, onEditGuest }) {
            const [isOver, setIsOver] = useState(false);

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsOver(true);
            };

            const handleDragLeave = () => {
                setIsOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsOver(false);
                const guestId = e.dataTransfer.getData('guestId');
                if (guestId) {
                    onDropGuest(guestId, tableId, seatIndex);
                }
            };

            const handleMouseDown = (e) => {
                // Empêche le clic sur un siège de déplacer la table
                e.stopPropagation();
            };

            return (
                <div
                    className={`seat-droppable w-12 h-12 rounded-full flex items-center justify-center border-2
                        ${isOver ? 'drag-over' : 'border-slate-300 bg-white shadow-sm'}
                        ${!guest ? 'hover:border-blue-400 cursor-pointer' : ''}
                    `}
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleDrop}
                    onMouseDown={handleMouseDown}
                >
                    {guest ? (
                        <div
                            draggable
                            onDragStart={(e) => onDragStart(e, guest.id)}
                            onDragEnd={onDragEnd}
                            onDoubleClick={(e) => {
                                e.stopPropagation();
                                onEditGuest(guest);
                            }}
                            className="w-full h-full bg-indigo-600 text-white rounded-full flex flex-col items-center justify-center cursor-grab active:cursor-grabbing shadow-md hover:bg-indigo-700 transition relative group"
                            title="Double-cliquez pour modifier"
                        >
                            {/* Initials */}
                            <span className="font-bold text-sm tracking-tight pointer-events-none">
                                {guest.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()}
                            </span>

                            {/* Full Name Tooltip */}
                            <div className="absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs py-1 px-3 rounded shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                                {guest.name}
                                <div className="absolute bottom-[-4px] left-1/2 -translate-x-1/2 w-2 h-2 bg-slate-800 rotate-45"></div>
                            </div>
                        </div>
                    ) : (
                        <span className="text-slate-300 text-xs font-semibold select-none">{seatIndex + 1}</span>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
