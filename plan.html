<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Table Interactif</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .seat-droppable { transition: all 0.2s ease; }
        .seat-droppable.drag-over { background-color: #dcfce7; border-color: #22c55e; transform: scale(1.1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-canvas { width: 100% !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; }
            .table-container { page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        #password-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8f0e3; display: flex; justify-content: center; align-items: center; z-index: 9999; font-family: Arial, sans-serif; }
        .password-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        .password-container h2 { color: #4a4137; margin-top: 0; margin-bottom: 20px; }
        .password-input-wrapper { margin-bottom: 15px; }
        .password-container input[type="password"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .password-container button { background-color: #c8a07d; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        .password-container button:hover { background-color: #b58d6b; }
        #password-error { color: #d32f2f; display: none; margin-bottom: 10px; font-size: 14px; }
        #app-wrapper { display: none; height: 100vh; width: 100vw; overflow: hidden; }
    </style>
</head>
<body class="text-slate-800 m-0">

    <div id="password-modal">
        <div class="password-container">
            <h2>Plan de table</h2>
            <p style="margin-bottom: 20px; color: #666; font-size: 14px;">Entrez le mot de passe pour accéder à cette page secrète.</p>
            <div class="password-input-wrapper">
                <input type="password" id="password-input" placeholder="Mot de passe">
            </div>
            <div id="password-error">Mot de passe incorrect.</div>
            <button onclick="checkPassword()">Accéder</button>
        </div>
    </div>

    <div id="app-wrapper">
        <div id="root" class="h-full w-full"></div>
    </div>

    <script>
        const correctPassword = "Table";
        function checkPassword() {
            const input = document.getElementById("password-input").value;
            if (input === correctPassword) {
                document.getElementById("password-modal").style.display = "none";
                document.getElementById("app-wrapper").style.display = "block";
            } else {
                document.getElementById("password-error").style.display = "block";
            }
        }
        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") checkPassword();
        });
    </script>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // L'URL de votre Google Apps Script a bien été intégrée ici
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwr0IOEauPNkajOtCLxnS6gvSqO42GzKVA9bu3_A5cFwIV1aFZZHTFgIIc1ONc32XWyEw/exec";

        const Icons = {
            ZoomIn: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>,
            ZoomOut: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>,
            RefreshCcw: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>,
            Users: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Plus: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Printer: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            Trash: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"/></svg>,
            Wand: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2.7 10.3a2.41 2.41 0 0 0 0 3.41l7.59 7.59a2.41 2.41 0 0 0 3.41 0l7.59-7.59a2.4 2.4 0 0 0 0-3.41l-7.59-7.59a2.41 2.41 0 0 0-3.41 0Z"/><path d="m5 12 7-7"/><path d="M8 9h.01"/><path d="M12 5h.01"/><path d="M16 9h.01"/></svg>,
            Pencil: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Save: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
            Settings: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        };

        const generateInitialGuests = () => []; // Vide par défaut
        const initialTables = []; // Vide par défaut pour vous laisser dessiner

        function App() {
            const [isInitializing, setIsInitializing] = useState(true);
            const [dataLoaded, setDataLoaded] = useState(false);
            const [guests, setGuests] = useState([]);
            const [tables, setTables] = useState([]);
            const [saveStatus, setSaveStatus] = useState("ready");

            const [newGuestName, setNewGuestName] = useState("");
            const [editingGuest, setEditingGuest] = useState(null);
            const [editingItem, setEditingItem] = useState(null); // Pour modifier les tables/tentes
            const [draggingTable, setDraggingTable] = useState(null);

            // Nouvelles variables d'état pour les fonctionnalités Zoom et Noms complets
            const [showFullNames, setShowFullNames] = useState(false);
            const [zoomLevel, setZoomLevel] = useState(1);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        if (APPS_SCRIPT_URL === "URL_APPS_SCRIPT_ICI") {
                            setGuests(generateInitialGuests());
                            setTables(initialTables);
                            setDataLoaded(true);
                            setIsInitializing(false);
                            return;
                        }
                        const response = await fetch(APPS_SCRIPT_URL);
                        const data = await response.json();
                        if (data && data.guests && data.tables) {
                            setGuests(data.guests);
                            setTables(data.tables);
                        } else {
                            setGuests(generateInitialGuests());
                            setTables(initialTables);
                        }
                    } catch (error) {
                        setGuests(generateInitialGuests());
                        setTables(initialTables);
                    } finally {
                        setDataLoaded(true);
                        setIsInitializing(false);
                    }
                };
                loadData();
            }, []);

            const isFirstLoad = React.useRef(true);
            useEffect(() => {
                if (!dataLoaded) return;
                if (isFirstLoad.current) { isFirstLoad.current = false; return; }
                const timer = setTimeout(() => saveData(), 1500);
                return () => clearTimeout(timer);
            }, [guests, tables, dataLoaded]);

            const saveData = async () => {
                if (APPS_SCRIPT_URL === "URL_APPS_SCRIPT_ICI") return;
                setSaveStatus("saving");
                try {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ guests, tables }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const result = await response.json();
                    if (result.status === "success") {
                        setSaveStatus("success");
                        setTimeout(() => setSaveStatus("ready"), 2000);
                    } else throw new Error(result.message);
                } catch (error) {
                    setSaveStatus("error");
                }
            };

            const unassignedGuests = useMemo(() => guests.filter(g => g.tableId === null), [guests]);
            const seatedCount = guests.length - unassignedGuests.length;
            const totalCapacity = tables.filter(t => t.type === 'round' || t.type === 'rect').reduce((sum, table) => sum + table.capacity, 0);

            // Drag Guests
            const handleDragStart = (e, guestId) => {
                e.dataTransfer.setData('guestId', guestId);
                setTimeout(() => e.target.classList.add('opacity-50'), 0);
            };
            const handleDragEnd = (e) => e.target.classList.remove('opacity-50');

            const handleDropOnSeat = (guestId, targetTableId, targetSeatIndex) => {
                setGuests(prev => {
                    const newGuests = [...prev];
                    const draggedIndex = newGuests.findIndex(g => g.id === guestId);
                    if (draggedIndex === -1) return prev;
                    const draggedGuest = newGuests[draggedIndex];
                    const existingGuestIndex = newGuests.findIndex(g => g.tableId === targetTableId && g.seatIndex === targetSeatIndex);

                    if (existingGuestIndex !== -1) {
                        const existingGuest = newGuests[existingGuestIndex];
                        newGuests[existingGuestIndex] = { ...existingGuest, tableId: draggedGuest.tableId, seatIndex: draggedGuest.seatIndex };
                    }
                    newGuests[draggedIndex] = { ...draggedGuest, tableId: targetTableId, seatIndex: targetSeatIndex };
                    return newGuests;
                });
            };

            const handleDropUnassigned = (e) => {
                e.preventDefault();
                const guestId = e.dataTransfer.getData('guestId');
                if (guestId) setGuests(prev => prev.map(g => g.id === guestId ? { ...g, tableId: null, seatIndex: null } : g));
            };

            // Drag Tables
            const handleTableMouseDown = (e, tableId) => {
                if (e.button !== 0) return;
                const table = tables.find(t => t.id === tableId);
                setDraggingTable({ id: tableId, startX: e.pageX, startY: e.pageY, origX: table.x, origY: table.y });
            };
            const handleCanvasMouseMove = (e) => {
                if (!draggingTable) return;
                const dx = (e.pageX - draggingTable.startX) / zoomLevel;
                const dy = (e.pageY - draggingTable.startY) / zoomLevel;
                setTables(prev => prev.map(t => t.id === draggingTable.id ? { ...t, x: Math.max(50, draggingTable.origX + dx), y: Math.max(50, draggingTable.origY + dy) } : t));
            };
            const handleCanvasMouseUp = () => setDraggingTable(null);

            // Actions
            const addGuest = (e) => {
                e.preventDefault();
                if (!newGuestName.trim()) return;
                setGuests([...guests, { id: `g-${Date.now()}`, name: newGuestName.trim(), tableId: null, seatIndex: null }]);
                setNewGuestName("");
            };
            const removeGuest = (guestId) => {
                if (confirm("Supprimer cet invité ?")) setGuests(prev => prev.filter(g => g.id !== guestId));
            };
            
            // Add Elements
            const addTable = (type) => {
                const newTable = { id: `t-${Date.now()}`, type, name: type === 'tent' ? 'Tente principale' : type === 'text' ? 'Texte libre' : 'Nouvelle Table', capacity: type === 'round' || type === 'rect' ? 10 : 0, x: window.scrollX + 400, y: window.scrollY + 300, rotation: 0, width: type === 'tent' ? 800 : 0, height: type === 'tent' ? 600 : 0 };
                setTables([...tables, newTable]);
            };

            const handleEditItemSubmit = (e) => {
                e.preventDefault();
                setTables(prev => prev.map(t => t.id === editingItem.id ? editingItem : t));
                setEditingItem(null);
            };

            const removeTable = (tableId) => {
                if (confirm("Supprimer cet élément ? Tous les invités placés dessus seront remis dans la liste.")) {
                    setGuests(prev => prev.map(g => g.tableId === tableId ? { ...g, tableId: null, seatIndex: null } : g));
                    setTables(prev => prev.filter(t => t.id !== tableId));
                    setEditingItem(null);
                }
            };

            if (isInitializing || !dataLoaded) return <div className="h-full w-full flex items-center justify-center bg-slate-50"><div className="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div></div>;

            return (
                <div className="flex h-full w-full bg-slate-50 relative">
                    {/* Sidebar */}
                    <div className="w-80 bg-white border-r border-slate-200 shadow-xl flex flex-col z-10 no-print transition-all">
                        <div className="p-5 border-b border-slate-100 bg-slate-50">
                            <h1 className="text-xl font-bold text-slate-800 flex items-center gap-2"><Icons.Users /> Liste des invités</h1>
                            <p className="text-sm text-slate-500 mt-1">{seatedCount} sur {guests.length} Placés</p>
                            {guests.length > totalCapacity && totalCapacity > 0 && <div className="mt-3 text-xs p-2 bg-red-50 text-red-600 rounded-md border border-red-100">Attention : Pas assez de places ! Capacité : {totalCapacity}.</div>}
                            <form onSubmit={addGuest} className="mt-4 flex gap-2">
                                <input type="text" value={newGuestName} onChange={(e) => setNewGuestName(e.target.value)} placeholder="Nouveau nom..." className="flex-1 px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                <button type="submit" className="p-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition"><Icons.Plus /></button>
                            </form>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4" onDrop={handleDropUnassigned} onDragOver={(e) => e.preventDefault()}>
                            <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-1">Non assignés ({unassignedGuests.length})</h2>
                            <div className="space-y-2">
                                {unassignedGuests.map(guest => (
                                    <div key={guest.id} draggable onDragStart={(e) => handleDragStart(e, guest.id)} onDragEnd={handleDragEnd} className="bg-white border border-slate-200 p-3 rounded-lg shadow-sm cursor-grab active:cursor-grabbing hover:border-blue-300 transition-all flex items-center gap-3 group">
                                        <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xs">{guest.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()}</div>
                                        <span className="font-medium text-slate-700 text-sm truncate">{guest.name}</span>
                                        <div className="ml-auto opacity-0 group-hover:opacity-100 flex items-center gap-1">
                                            <button onClick={() => setEditingGuest(guest)} className="p-1 text-slate-400 hover:text-blue-600"><Icons.Pencil /></button>
                                            <button onClick={() => removeGuest(guest.id)} className="p-1 text-slate-400 hover:text-red-600"><Icons.Trash /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Canvas */}
                    <div className="flex-1 overflow-auto print-canvas relative bg-slate-50">
                        <div className="sticky top-0 left-0 right-0 p-4 flex justify-between items-center no-print z-20 pointer-events-none">
                            <div className="bg-white px-3 py-1.5 rounded-full shadow-md border border-slate-200 flex items-center gap-2 pointer-events-auto">
                                {saveStatus === "ready" && <span className="text-xs text-slate-500 flex items-center gap-1"><Icons.Save /> Sauvegardé</span>}
                                {saveStatus === "saving" && <span className="text-xs text-blue-500 flex items-center gap-1"><div className="w-3 h-3 border-2 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div> Sauvegarde...</span>}
                                {saveStatus === "error" && <span className="text-xs text-red-500 flex items-center gap-1"><Icons.Trash /> Erreur de sauvegarde</span>}
                                {APPS_SCRIPT_URL === "URL_APPS_SCRIPT_ICI" && <span className="text-xs text-amber-600">⚠️ Mode local (non sauvegardé)</span>}
                            </div>

                            <div className="flex gap-2 pointer-events-auto bg-white p-1 rounded-lg shadow-md border border-slate-200">
                                {/* Toggle Noms entiers */}
                                <button onClick={() => setShowFullNames(!showFullNames)} className={`px-3 py-2 text-sm font-medium rounded flex gap-1 items-center transition-colors ${showFullNames ? 'bg-blue-100 text-blue-700' : 'text-slate-700 hover:bg-slate-100'}`} title="Afficher les noms entiers">
                                    <Icons.Users /> {showFullNames ? 'Noms entiers' : 'Initiales'}
                                </button>
                                <div className="w-px bg-slate-200 mx-1"></div>
                                {/* Contrôles de Zoom */}
                                <div className="flex items-center gap-1 px-1">
                                    <button onClick={() => setZoomLevel(z => Math.max(0.3, z - 0.1))} className="p-2 text-slate-600 hover:bg-slate-100 rounded" title="Dézoomer"><Icons.ZoomOut /></button>
                                    <span className="text-xs font-medium text-slate-500 w-12 text-center">{Math.round(zoomLevel * 100)}%</span>
                                    <button onClick={() => setZoomLevel(z => Math.min(2, z + 0.1))} className="p-2 text-slate-600 hover:bg-slate-100 rounded" title="Zoomer"><Icons.ZoomIn /></button>
                                    <button onClick={() => setZoomLevel(1)} className="p-2 text-slate-600 hover:bg-slate-100 rounded" title="Réinitialiser le zoom"><Icons.RefreshCcw /></button>
                                </div>
                                <div className="w-px bg-slate-200 mx-1"></div>
                                {/* Ajout d'éléments */}
                                <button onClick={() => addTable('round')} className="px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded flex gap-1 items-center" title="Table Ronde"><Icons.Plus /> ◯</button>
                                <button onClick={() => addTable('rect')} className="px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded flex gap-1 items-center" title="Table Rectangulaire"><Icons.Plus /> ▭</button>
                                <button onClick={() => addTable('tent')} className="px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded flex gap-1 items-center" title="Tente / Zone">Tente</button>
                                <button onClick={() => addTable('text')} className="px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded flex gap-1 items-center" title="Texte libre">Texte</button>
                                <button onClick={() => window.print()} className="ml-2 flex items-center gap-2 px-3 py-2 bg-slate-800 text-white rounded text-sm hover:bg-slate-700"><Icons.Printer /></button>
                            </div>
                        </div>

                        <div className="absolute top-0 left-0 min-w-[3000px] min-h-[3000px] bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] overflow-hidden table-container origin-top-left"
                             style={{
                                backgroundSize: `${30 * zoomLevel}px ${30 * zoomLevel}px`,
                                width: `${Math.max(100, 3000 * zoomLevel)}px`,
                                height: `${Math.max(100, 3000 * zoomLevel)}px`
                             }}
                             onMouseMove={handleCanvasMouseMove} onMouseUp={handleCanvasMouseUp} onMouseLeave={handleCanvasMouseUp}
                             onWheel={(e) => {
                                 if (e.ctrlKey || e.metaKey) {
                                     e.preventDefault();
                                     const delta = e.deltaY > 0 ? -0.1 : 0.1;
                                     setZoomLevel(z => Math.max(0.3, Math.min(2, z + delta)));
                                 }
                             }}>
                            {/* Un conteneur interne pour appliquer le zoom scale aux éléments (les tables, tentes, etc.) */}
                            <div style={{ transform: `scale(${zoomLevel})`, transformOrigin: '0 0', width: '100%', height: '100%' }}>

                            {/* Render Tents First (lowest Z-index) */}
                            {tables.filter(t => t.type === 'tent').map(t => (
                                <Tent key={t.id} item={t} onMouseDown={handleTableMouseDown} isDragging={draggingTable?.id === t.id} onDoubleClick={() => setEditingItem(t)} />
                            ))}
                            
                            {/* Render Tables & Text */}
                            {tables.filter(t => t.type !== 'tent').map(table => {
                                if (table.type === 'rect') return <RectTable key={table.id} table={table} guests={guests} onDropGuest={handleDropOnSeat} onDragStart={handleDragStart} onDragEnd={handleDragEnd} onMouseDown={handleTableMouseDown} isDragging={draggingTable?.id === table.id} onEditGuest={setEditingGuest} onDoubleClick={() => setEditingItem(table)} showFullNames={showFullNames} />
                                if (table.type === 'round') return <RoundTable key={table.id} table={table} guests={guests} onDropGuest={handleDropOnSeat} onDragStart={handleDragStart} onDragEnd={handleDragEnd} onMouseDown={handleTableMouseDown} isDragging={draggingTable?.id === table.id} onEditGuest={setEditingGuest} onDoubleClick={() => setEditingItem(table)} showFullNames={showFullNames} />
                                if (table.type === 'text') return <TextItem key={table.id} item={table} onMouseDown={handleTableMouseDown} isDragging={draggingTable?.id === table.id} onDoubleClick={() => setEditingItem(table)} />
                                return null;
                            })}
                            </div>
                        </div>
                    </div>

                    {/* Modals */}
                    {editingGuest && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Pencil /> Modifier l'invité</h3>
                                <form onSubmit={(e) => { e.preventDefault(); setGuests(prev => prev.map(g => g.id === editingGuest.id ? editingGuest : g)); setEditingGuest(null); }}>
                                    <input type="text" value={editingGuest.name} onChange={(e) => setEditingGuest({...editingGuest, name: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg mb-4" autoFocus />
                                    <div className="flex justify-between">
                                        <button type="button" onClick={() => { removeGuest(editingGuest.id); setEditingGuest(null); }} className="px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg font-medium"><Icons.Trash /></button>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setEditingGuest(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium">Annuler</button>
                                            <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">Enregistrer</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {editingItem && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Settings /> Paramètres de l'élément</h3>
                                <form onSubmit={handleEditItemSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700">Texte / Nom</label>
                                        <input type="text" value={editingItem.name} onChange={(e) => setEditingItem({...editingItem, name: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg mt-1" autoFocus />
                                    </div>
                                    
                                    {(editingItem.type === 'round' || editingItem.type === 'rect') && (
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700">Nombre de chaises</label>
                                            <input type="number" min="0" max="50" value={editingItem.capacity} onChange={(e) => setEditingItem({...editingItem, capacity: parseInt(e.target.value) || 0})} className="w-full px-3 py-2 border border-slate-300 rounded-lg mt-1" />
                                        </div>
                                    )}

                                    {editingItem.type === 'tent' && (
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="block text-sm font-medium text-slate-700">Largeur</label>
                                                <input type="number" value={editingItem.width} onChange={(e) => setEditingItem({...editingItem, width: parseInt(e.target.value) || 0})} className="w-full px-3 py-2 border border-slate-300 rounded-lg mt-1" />
                                            </div>
                                            <div className="flex-1">
                                                <label className="block text-sm font-medium text-slate-700">Hauteur</label>
                                                <input type="number" value={editingItem.height} onChange={(e) => setEditingItem({...editingItem, height: parseInt(e.target.value) || 0})} className="w-full px-3 py-2 border border-slate-300 rounded-lg mt-1" />
                                            </div>
                                        </div>
                                    )}

                                    {editingItem.type !== 'round' && (
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700">Rotation</label>
                                            <select value={editingItem.rotation} onChange={(e) => setEditingItem({...editingItem, rotation: parseInt(e.target.value)})} className="w-full px-3 py-2 border border-slate-300 rounded-lg mt-1">
                                                <option value="0">0° (Horizontal)</option>
                                                <option value="90">90° (Vertical)</option>
                                                <option value="180">180° (Inversé)</option>
                                                <option value="270">270° (Vertical inv.)</option>
                                            </select>
                                        </div>
                                    )}

                                    <div className="flex justify-between pt-4 border-t border-slate-100">
                                        <button type="button" onClick={() => removeTable(editingItem.id)} className="px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg font-medium flex gap-2 items-center"><Icons.Trash /> Supprimer</button>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setEditingItem(null)} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium">Annuler</button>
                                            <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">Valider</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- COMPONENTS ---

        function RectTable({ table, guests, onDropGuest, onDragStart, onDragEnd, onMouseDown, isDragging, onEditGuest, onDoubleClick, showFullNames }) {
            const halfCapacity = Math.ceil(table.capacity / 2);
            const seatWidth = showFullNames ? 100 : 60; // On élargit l'espace si les noms complets sont affichés
            const computedWidth = Math.max(150, halfCapacity * seatWidth + 40); // S'adapte au nombre de chaises
            const rotation = table.rotation || 0;

            const renderSeats = (startIndex, endIndex) => (
                <div className="flex justify-center gap-4 px-4 z-10" style={{ width: computedWidth }}>
                    {Array.from({ length: endIndex - startIndex }).map((_, idx) => {
                        const i = startIndex + idx;
                        const guest = guests.find(g => g.tableId === table.id && g.seatIndex === i);
                        return <Seat key={i} tableId={table.id} seatIndex={i} guest={guest} onDropGuest={onDropGuest} onDragStart={onDragStart} onDragEnd={onDragEnd} onEditGuest={onEditGuest} rotation={rotation} showFullNames={showFullNames} />;
                    })}
                </div>
            );

            return (
                <div style={{ position: 'absolute', left: table.x, top: table.y, transform: `rotate(${rotation}deg)` }} className={`flex flex-col items-center transition-shadow ${isDragging ? 'z-50 cursor-grabbing drop-shadow-2xl' : 'z-10 cursor-grab drop-shadow-md'} hover:drop-shadow-xl`} onMouseDown={(e) => onMouseDown(e, table.id)} onDoubleClick={onDoubleClick}>
                    <div className="mb-2">{renderSeats(0, halfCapacity)}</div>
                    <div style={{ width: computedWidth }} className="h-24 bg-gradient-to-b from-slate-200 to-slate-300 border-2 border-slate-300 rounded-md shadow-lg flex items-center justify-center relative cursor-pointer" title="Double-cliquez pour modifier">
                        {/* Contre-rotation du texte pour le garder lisible */}
                        <span style={{ transform: `rotate(${-rotation}deg)` }} className="font-semibold text-slate-500 uppercase tracking-widest text-lg px-4 text-center">{table.name}</span>
                        <div className="absolute inset-2 border border-slate-300/50 rounded pointer-events-none"></div>
                    </div>
                    <div className="mt-2">{renderSeats(halfCapacity, table.capacity)}</div>
                </div>
            );
        }

        function RoundTable({ table, guests, onDropGuest, onDragStart, onDragEnd, onMouseDown, isDragging, onEditGuest, onDoubleClick, showFullNames }) {
            // Augmenter l'espace si les noms complets sont affichés
            const seatSpace = showFullNames ? 24 : 16;
            const extraRadius = showFullNames ? 45 : 35;
            const tableDiameter = Math.max(120, table.capacity * seatSpace);
            const seatRadius = (tableDiameter / 2) + extraRadius;

            const seats = Array.from({ length: table.capacity }).map((_, i) => {
                const guest = guests.find(g => g.tableId === table.id && g.seatIndex === i);
                const angleDegree = (i * (360 / table.capacity));
                // Centrage ajusté selon qu'on affiche les noms longs ou courts
                const seatStyle = {
                    position: 'absolute',
                    top: '50%',
                    left: '50%',
                    marginTop: '-24px', // base margin
                    marginLeft: showFullNames ? '-48px' : '-24px', // ajuster si width plus large
                    width: showFullNames ? '96px' : '48px', // espace alloué pour le conteneur du siège
                    display: 'flex',
                    justifyContent: 'center',
                    transform: `rotate(${angleDegree}deg) translateY(-${seatRadius}px) rotate(-${angleDegree}deg)`
                };
                return (
                    <div key={i} style={seatStyle} className="z-10">
                        <Seat tableId={table.id} seatIndex={i} guest={guest} onDropGuest={onDropGuest} onDragStart={onDragStart} onDragEnd={onDragEnd} onEditGuest={onEditGuest} rotation={0} showFullNames={showFullNames} />
                    </div>
                );
            });

            return (
                <div style={{ position: 'absolute', left: table.x, top: table.y, width: tableDiameter, height: tableDiameter }} className={`transition-shadow ${isDragging ? 'z-50 cursor-grabbing drop-shadow-2xl' : 'z-10 cursor-grab drop-shadow-md'} hover:drop-shadow-xl`} onMouseDown={(e) => onMouseDown(e, table.id)} onDoubleClick={onDoubleClick} title="Double-cliquez pour modifier">
                    <div className="w-full h-full bg-gradient-to-br from-slate-200 to-slate-300 border-2 border-slate-300 rounded-full shadow-lg flex items-center justify-center absolute inset-0 cursor-pointer">
                        <div className="text-center px-4">
                            <span className="font-bold text-slate-600 block text-sm">{table.name}</span>
                            <span className="text-xs text-slate-400 font-medium">{table.capacity} Places</span>
                        </div>
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 border border-slate-300/60 rounded-full pointer-events-none"></div>
                    </div>
                    {seats}
                </div>
            );
        }

        function Tent({ item, onMouseDown, isDragging, onDoubleClick }) {
            return (
                <div style={{ position: 'absolute', left: item.x, top: item.y, width: item.width || 800, height: item.height || 600, transform: `rotate(${item.rotation || 0}deg)` }} className={`border-4 border-dashed border-slate-300/60 bg-slate-200/10 rounded-lg flex items-start justify-start p-6 ${isDragging ? 'z-0 cursor-grabbing' : 'z-0 cursor-grab'} hover:border-slate-400 hover:bg-slate-200/30 transition-colors`} onMouseDown={(e) => onMouseDown(e, item.id)} onDoubleClick={onDoubleClick} title="Double-cliquez pour modifier la tente">
                    <span className="text-slate-400 font-semibold text-3xl uppercase tracking-widest pointer-events-none">{item.name}</span>
                </div>
            )
        }

        function TextItem({ item, onMouseDown, isDragging, onDoubleClick }) {
            return (
                <div style={{ position: 'absolute', left: item.x, top: item.y, transform: `rotate(${item.rotation || 0}deg)` }} className={`p-4 bg-white/50 backdrop-blur-sm rounded border border-transparent hover:border-slate-300 ${isDragging ? 'z-50 cursor-grabbing' : 'z-10 cursor-grab'}`} onMouseDown={(e) => onMouseDown(e, item.id)} onDoubleClick={onDoubleClick} title="Double-cliquez pour modifier">
                    <span className="text-slate-800 font-bold text-2xl uppercase tracking-wider">{item.name}</span>
                </div>
            )
        }

        function Seat({ tableId, seatIndex, guest, onDropGuest, onDragStart, onDragEnd, onEditGuest, rotation, showFullNames }) {
            const [isOver, setIsOver] = useState(false);
            const handleDrop = (e) => { e.preventDefault(); setIsOver(false); const id = e.dataTransfer.getData('guestId'); if (id) onDropGuest(id, tableId, seatIndex); };

            const seatClasses = showFullNames
                ? `seat-droppable min-w-[72px] h-auto min-h-[48px] px-2 py-1 rounded-2xl flex items-center justify-center border-2`
                : `seat-droppable w-12 h-12 rounded-full flex items-center justify-center border-2`;

            const guestInnerClasses = showFullNames
                ? `w-full h-full bg-indigo-600 text-white rounded-xl flex flex-col items-center justify-center cursor-grab active:cursor-grabbing shadow-md hover:bg-indigo-700 transition relative group px-1 py-1`
                : `w-full h-full bg-indigo-600 text-white rounded-full flex flex-col items-center justify-center cursor-grab active:cursor-grabbing shadow-md hover:bg-indigo-700 transition relative group`;

            return (
                <div className={`${seatClasses} ${isOver ? 'drag-over' : 'border-slate-300 bg-white shadow-sm'} ${!guest ? 'hover:border-blue-400 cursor-pointer' : ''}`} onDragOver={(e) => { e.preventDefault(); setIsOver(true); }} onDragLeave={() => setIsOver(false)} onDrop={handleDrop} onMouseDown={(e) => e.stopPropagation()}>
                    {guest ? (
                        <div draggable onDragStart={(e) => onDragStart(e, guest.id)} onDragEnd={onDragEnd} onDoubleClick={(e) => { e.stopPropagation(); onEditGuest(guest); }} className={guestInnerClasses}>
                            <span style={{ transform: `rotate(${-rotation}deg)` }} className={`font-bold pointer-events-none text-center leading-tight ${showFullNames ? 'text-[10px] whitespace-normal' : 'text-sm tracking-tight'}`}>
                                {showFullNames ? guest.name : guest.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()}
                            </span>
                            {!showFullNames && (
                                <div style={{ transform: `translateX(-50%) rotate(${-rotation}deg)` }} className="absolute -top-10 left-1/2 bg-slate-800 text-white text-xs py-1 px-3 rounded shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-[100]">
                                    {guest.name}
                                </div>
                            )}
                        </div>
                    ) : (
                        <span style={{ transform: `rotate(${-rotation}deg)` }} className="text-slate-300 text-xs font-semibold select-none inline-block">{seatIndex + 1}</span>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
